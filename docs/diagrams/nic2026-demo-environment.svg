</text>
<polyline id="alert-incident" points="328,446 450,446" fill="none" stroke="#98f8fe" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="8 7"/>
<polyline id="incident-teams" points="734,446 856,446" fill="none" stroke="#98f8fe" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="8 7"/>
<text id="workflow-state" x="1108" y="440" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="20">
<tspan x="1108" dy="0">Conceptual route</tspan>
<tspan x="1108" dy="25.0">Acceptance gated</tspan>
</text>
<text id="workflow-input" x="28" y="508" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
