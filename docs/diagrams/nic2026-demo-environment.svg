<polyline id="guest-planned" points="687,156 687,266 1010,266" fill="none" stroke="#98f8fe" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="8 7"/>
<text id="guest-label" x="715" y="248" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
