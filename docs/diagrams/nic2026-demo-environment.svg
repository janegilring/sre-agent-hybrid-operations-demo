<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">NIC demo environment: private investigation and independent telemetry</title>
<desc id="diagram-desc">Azure-hosted LocalBox nested lab. Cloud SRE Agent uses managed identity over private VNet outbound to MCP, then Kerberos to JEA on two Azure Local nodes. Selected reads are proved, not full provider inventory. Optional guest JEA is planned and unverified. Arc with configured AMA sends outbound telemetry independently. Dashed incident, Teams and human-approved repair workflows remain acceptance-gated. Resource Bridge is infrastructure, not a workload guest. Arc registration does not imply AMA collection.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#98f8fe" stroke-width="2"/></marker><marker id="arrowhead-start" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#98f8fe" stroke-width="2"/></marker></defs>
<rect width="1440" height="590" fill="#1a1b1b"/>
<rect id="cloud-plane" x="8" y="4" width="330" height="318" rx="10" fill="none" stroke="#98f8fe" stroke-width="2"/>
<rect id="private-plane" x="358" y="4" width="1070" height="318" rx="10" fill="none" stroke="#98f8fe" stroke-width="2"/>
<text id="cloud-label" x="24" y="34" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
<tspan x="24" dy="0">AZURE / CLOUD PLANE</tspan>
</text>
<text id="private-label" x="378" y="34" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
<tspan x="378" dy="0">PRIVATE NETWORK / AZURE-HOSTED LOCALBOX NESTED LAB</tspan>
</text>
