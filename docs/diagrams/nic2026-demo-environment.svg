<tspan x="44" dy="0">Azure SRE Agent</tspan>
</text>
<text id="agent-detail" x="44" y="137" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
<tspan x="44" dy="0">Scoped tools + identity</tspan>
</text>
<rect id="mcp" x="550" y="64" width="274" height="92" rx="10" fill="#193233" stroke="#98f8fe" stroke-width="2"/>
<text id="mcp-title" x="566" y="103" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="26">
<tspan x="566" dy="0">Private MCP endpoint</tspan>
</text>
<text id="mcp-detail" x="566" y="137" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
<tspan x="566" dy="0">Authenticated tools</tspan>
</text>
<rect id="node1" x="1040" y="64" width="168" height="92" rx="10" fill="#193233" stroke="#98f8fe" stroke-width="2"/>
