<tspan x="1056" dy="0">JEA / node 1</tspan>
</text>
<text id="node1-detail" x="1056" y="137" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
<tspan x="1056" dy="0">Azure Local</tspan>
</text>
<rect id="node2" x="1230" y="64" width="168" height="92" rx="10" fill="#193233" stroke="#98f8fe" stroke-width="2"/>
<text id="node2-title" x="1246" y="103" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="26">
<tspan x="1246" dy="0">JEA / node 2</tspan>
</text>
<text id="node2-detail" x="1246" y="137" fill="#c3fbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22">
